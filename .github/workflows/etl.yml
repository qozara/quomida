name: ETL Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/etl-pipeline/**'
      - 'packages/**'
      - '.github/workflows/etl.yml'
  pull_request:
    paths:
      - 'apps/etl-pipeline/**'
      - 'packages/**'
      - '.github/workflows/etl.yml'
  schedule:
    # Run every 6 months (Jan 1st and Jul 1st at midnight)
    - cron: '0 0 1 1,7 *'
  workflow_dispatch:
    inputs:
      include_openfoodfacts:
        description: 'Download & process Open Food Facts (13GB .gz)'
        required: true
        type: boolean
        default: false
      include_regional:
        description: 'Download & process LATAM Regional CSVs (Argenfoods, SARA2, TBCA)'
        required: true
        type: boolean
        default: true
      include_usda:
        description: 'Download & process USDA FoodData Central CSV'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Maximize Build Space
        # This frees up ~30GB of disk space on the GitHub runner, essential for the 13GB OFF file
        if: ${{ github.event.inputs.include_openfoodfacts == 'true' || github.event_name == 'schedule' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Cache Open Food Facts Dataset
        if: ${{ github.event.inputs.include_openfoodfacts == 'true' || github.event_name == 'schedule' }}
        uses: actions/cache@v4
        with:
          path: apps/etl-pipeline/data/raw/openfoodfacts/openfoodfacts-products.jsonl.gz
          # Cache keyed by month so we download a fresh copy monthly
          key: off-dataset-${{ runner.os }}-${{ env.CACHE_DATE }}
          restore-keys: |
            off-dataset-${{ runner.os }}-

      - name: Set Cache Date
        if: ${{ github.event.inputs.include_openfoodfacts == 'true' || github.event_name == 'schedule' }}
        run: echo "CACHE_DATE=$(date +'%Y-%m')" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ETL Pipeline (Download & Parse)
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.include_openfoodfacts }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            FLAGS="$FLAGS --with-off"
          fi
          if [ "${{ github.event.inputs.include_regional }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            FLAGS="$FLAGS --with-regional"
          fi
          if [ "${{ github.event.inputs.include_usda }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            FLAGS="$FLAGS --with-usda"
          fi
          npm run etl -- $FLAGS

      - name: Prepare for Cloudflare Pages Deployment
        run: |
          # Remove catalog.json from .gitignore so Wrangler includes it in the upload
          sed -i '/catalog\.json/d' .gitignore || true
          rm -f apps/webapp/public/.gitignore || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/webapp/public --project-name=quomida-etl --branch=${{ github.head_ref || github.ref_name }}

name: CI Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/webapp/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/webapp/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & domain tests
        run: npm run test

      - name: Build monorepo packages and apps
        env:
          SYSTEM_INGREDIENTS_URL: ${{ vars.SYSTEM_INGREDIENTS_URL }}
          SYSTEM_PORTIONS_URL: ${{ vars.SYSTEM_PORTIONS_URL }}
        run: npm run build
